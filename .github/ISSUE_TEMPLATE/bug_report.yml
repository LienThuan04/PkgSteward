name: Bug report
description: Report something that does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Do not report security vulnerabilities here.** Follow [SECURITY.md](https://github.com/LienThuan04/Manager-NPM/blob/main/SECURITY.md) instead.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (manager_npm_be)
        - Frontend (manager_npm_fe)
        - Documentation
        - CI / tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the backend with `pnpm dev`
        2. Open http://localhost:3000
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant terminal or browser console output. Remove any private paths or secrets.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: For UI bugs, drag and drop screenshots here.

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version (`node --version`), pnpm version (`pnpm --version`), browser
      placeholder: Windows 11, Node 24.x, pnpm 11.x, Chrome 141
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this bug has not been reported yet.
          required: true
        - label: This is not a security vulnerability.
          required: true
